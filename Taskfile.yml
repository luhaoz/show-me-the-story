version: "3"

vars:
  BINARY:
    sh: echo show-me-the-story$(go env GOEXE)

tasks:
  frontend:install:
    desc: 安装前端依赖
    dir: frontend
    cmds:
      - npm install

  frontend:build:
    desc: 构建前端
    dir: frontend
    deps: [frontend:install]
    cmds:
      - npm run build

  build:
    desc: 编译项目（含前端构建）
    deps: [frontend:build]
    cmds:
      - go build -o {{.BINARY}} .

  build:go:
    desc: 仅编译 Go（跳过前端，需先运行 frontend:build）
    cmds:
      - go build -o {{.BINARY}} .

  dev:
    desc: 编译并启动 Web 开发服务器
    deps: [build]
    cmds:
      - ./{{.BINARY}} --web

  build:gui:windows:
    desc: 构建 Windows Wails GUI（嵌入 WebView2 bootstrapper）
    cmds:
      - wails build -platform windows/amd64 -webview2 embed

  dev:gui:
    desc: 启动 Wails GUI 热重载开发环境
    cmds:
      - wails dev

  screenshots:
    desc: 用固定离线样例重建 README 截图
    dir: frontend
    deps: [frontend:install]
    cmds:
      - npm run screenshots

  dev:frontend:
    desc: 启动前端开发服务器（热重载）
    dir: frontend
    deps: [frontend:install]
    cmds:
      - npm run dev

  clean:
    desc: 清理编译产物
    cmds:
      - cmd: rm -f show-me-the-story show-me-the-story.exe
        platforms: [linux, darwin]
      - cmd: Remove-Item -Force -ErrorAction SilentlyContinue show-me-the-story.exe
        platforms: [windows]
      - cmd: rm -rf frontend/dist
        platforms: [linux, darwin]
